name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build, test and check formatting
        run: ./gradlew clean build -Penable_junit_testing=true -Penable_spotless=true --console=plain
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jars
          path: build/libs/*.jar
          if-no-files-found: error
