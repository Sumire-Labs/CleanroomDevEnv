org.gradle.jvmargs = -Xmx3G
org.gradle.caching = true

# Git tags determine the version. Do not set version or mod_version.
versioning.releaseBranch = main
# Keep alpha/beta/rc in release versions, e.g. tag 0.1.0-alpha.
versioning.stageInVersion = true

# Rename Java packages/directories when changing root_package.
root_package = com.example.modid
mod_id = modid
mod_name = Example Mod
mod_description =
mod_url =
mod_update_json =
mod_authors =
mod_credits =
mod_logo_path =
mod_issue_tracker =

cleanroom_version = 0.7.14-alpha

enable_mixin = true
cg.userdev.refmap = modid.refmap.json

generate_sources_jar = true
generate_javadocs_jar = false
enable_junit_testing = true
show_testing_output = false
enable_shadow = false
enable_spotless = false

# Optional AT filenames under src/main/resources/META-INF, separated by spaces.
# Write SRG member names, e.g. field_130070_K. Empty disables ATs.
access_transformers =
# Set a fully qualified IFMLLoadingPlugin class to enable the coremod.
coremod_plugin_class =
coremod_includes_mod = true
use_asset_mover = false
asset_mover_version = 3.0.1

minecraft_username = Developer
# Whitespace-delimited; quoted spaces are not supported.
extra_jvm_args =
enable_foundation_debug = false
enable_mixin_debug = false

# Maven: MCP main artifact, SRG runtime classifier.
# Credentials: TemplateMavenUsername / TemplateMavenPassword Gradle properties,
# or MAVEN_USERNAME / MAVEN_PASSWORD environment variables.
publish_to_maven = false
publish_to_local_maven = false
maven_name = TemplateMaven
maven_url =

# Optional Mod publishing. Empty IDs skip these destinations.
# Tokens: CURSEFORGE_TOKEN / MODRINTH_TOKEN environment variables.
curseforge_project_id =
modrinth_project_id =
